name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  lint-and-type:
    name: lint-and-type
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend ruff
        working-directory: backend
        run: ruff check .

      - name: Run backend mypy
        working-directory: backend
        env:
          PYTHONPATH: .
        run: mypy app

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend eslint
        working-directory: frontend
        run: |
          if [ ! -f eslint.config.js ] && [ ! -f .eslintrc* ]; then
            echo 'export default [{ files: ["**/*.{js,jsx,ts,tsx}"] }];' > eslint.config.js
          fi
          npx --yes eslint .

      - name: Run frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit

  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Run backend tests with coverage
        working-directory: backend
        env:
          TRIAGE_PROVIDER: simulated
          PYTHONPATH: .
        run: pytest --cov=app --cov-report=term --cov-fail-under=65

  test-frontend:
    name: test-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npx vitest run

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker buildx build -t civicpulse-backend:latest ./backend

      - name: Build frontend image
        run: docker buildx build -t civicpulse-frontend:latest ./frontend

  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Build images for scanning
        run: |
          docker buildx build --load -t civicpulse-backend:latest ./backend
          docker buildx build --load -t civicpulse-frontend:latest ./frontend

      - name: Scan backend image
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 civicpulse-backend:latest

      - name: Scan frontend image
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 civicpulse-frontend:latest

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Start services with Docker Compose
        run: docker compose up -d

      - name: Wait for /ready endpoint
        run: |
          for i in $(seq 1 45); do
            if curl -s -f http://localhost:8000/ready | grep -q "ready"; then
              echo "Backend /ready endpoint is ready!"
              break
            fi
            echo "Waiting for /ready endpoint... ($i/45)"
            sleep 2
          done
          curl -s -f http://localhost:8000/ready | grep -q "ready" || {
            echo "Backend failed to become ready in time"
            docker compose logs
            exit 1
          }

      - name: Run integration tests
        run: |
          # POST a complaint
          POST_RES=$(curl -s -f -X POST http://localhost:8000/api/complaints \
            -H "Content-Type: application/json" \
            -d '{"text": "A severe water leak is flooding the road", "location": "Main St 101"}')
          echo "POST response: $POST_RES"

          # Extract complaint ID
          COMPLAINT_ID=$(echo "$POST_RES" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          echo "Complaint ID: $COMPLAINT_ID"

          # GET it back
          GET_RES=$(curl -s -f "http://localhost:8000/api/complaints/$COMPLAINT_ID")
          echo "GET response: $GET_RES"

          # Assert category
          echo "$GET_RES" | python3 -c "import sys, json; data = json.load(sys.stdin); assert data.get('category') == 'water', f'Expected category water, got {data.get(\"category\")}'"
          echo "Assertion passed: complaint category is water."

      - name: Teardown services
        if: always()
        run: docker compose down -v
